# agent-panorama configuration (all sections optional).
#
# Pass with:  agent-panorama generate --input traces.json --output ./report --config config.yaml

# Map raw tool names to readable descriptions used in the report.
tool_descriptions:
  web_search: "Searched the web"
  get_weather: "Looked up the weather"
  send_email: "Sent an email"
  human_handoff: "Handed the task off to a person"

# Tool names whose calls are considered "consequential" (side effects) and
# therefore listed in the Decision Log. If omitted, every tool call is listed.
consequential_tools:
  - send_email
  - human_handoff

# Tool names that signal a human escalation (sets run outcome to "escalated").
escalation_tools:
  - human_handoff
  - handoff_to_agent

# Thresholds for the Anomalies section.
anomaly_thresholds:
  max_retries: 2          # more than this many retries is flagged
  max_latency_seconds: 30 # runs slower than this are flagged
  max_tool_calls: 15      # runs with more tool calls than this are flagged

# Step-narrative detail: "minimal", "standard" (default), or "richer".
# Overridden by the --detail CLI flag.
detail: standard

# Model used by --summarize to phrase minimal results (opt-in; needs the matching
# provider extra installed and its API key set). Overridden by --summarize-model.
summarize_model: "google_genai:gemini-2.5-flash-lite"

# Opt-in USD cost estimation. Keys are matched as substrings of each model name
# (longest match wins); prices are USD per 1,000,000 tokens. Omit this block
# entirely to keep cost out of the report (tokens remain the primary metric).
#
# Commented template (copy and adjust to your provider's current pricing):
# model_prices:
#   "<model-name-substring>":
#     input: <USD per 1M input tokens>
#     output: <USD per 1M output tokens>
#
# Live example covering the bundled sample traces:
model_prices:
  gpt-4o-mini:
    input: 0.15
    output: 0.60
  gpt-4o:
    input: 2.50
    output: 10.00
  claude-3-5-sonnet:
    input: 3.00
    output: 15.00

# Opt-in value layer (LLM-as-judge): scores each conversation 0-10 against
# YOUR definition of value, reporting value delivered/lost, fixes, and a
# verdict per success criterion. Needs the same provider extra + API key as
# --summarize. Omit this block entirely to keep the value layer off.
#
# value:
#   judge_model: google_genai:gemini-2.5-flash  # any init_chat_model id
#   max_judgments: 50           # hard cap per report (cost guard)
#   include_single_runs: true   # false = judge only multi-turn sessions
#   default:                    # fallback value definition for every agent
#     domain: customer support
#     user_goal: resolve the user's issue without human escalation
#     success_criteria:
#       - issue resolved in the conversation
#     custom_dimensions:
#       self_service: Did the user finish without needing a human?
#   contexts:                   # per-agent overrides, keyed by agent_key
#     kb-assistant:
#       domain: customer support
#       user_goal: the user resolves their issue
