[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-panorama"
version = "0.4.2"
description = "Turn Langfuse/LangSmith agent traces into human-readable Agent Activity Reports (Markdown + HTML)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-panorama contributors" }]
keywords = ["langfuse", "langsmith", "llm", "agents", "observability", "reporting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # Live-mode test dependencies (server, TestClient, real callback base class).
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "langchain-core>=0.3",
]
# Live dashboard server (`agent-panorama serve`).
live = ["fastapi>=0.110", "uvicorn>=0.29"]
# Optional LLM-backed result phrasing (--summarize). Install the provider you use.
gemini = ["langchain>=0.3", "langchain-google-genai>=2.0"]
openai = ["langchain>=0.3", "langchain-openai>=0.2"]
anthropic = ["langchain>=0.3", "langchain-anthropic>=0.2"]

[project.urls]
Homepage = "https://github.com/Idank96/agent-panorama"
Repository = "https://github.com/Idank96/agent-panorama"
Issues = "https://github.com/Idank96/agent-panorama/issues"

[project.scripts]
agent-panorama = "agent_panorama.cli:cli"

# The dashboard build output (frontend/ -> src/agent_panorama/static/) is
# gitignored, so hatchling's VCS-based file selection would silently drop it
# from wheels; declare it as a build artifact to keep it in.
[tool.hatch.build]
artifacts = ["src/agent_panorama/static/"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_panorama"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Test files manipulate sys.path before importing, so imports are intentionally
# ordered and not at the top of the file.
"tests/*" = ["E402", "I001"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# Bare ``dict``/``list`` annotations are the house style across the parsers
# (raw, heterogeneous trace payloads); requiring full generics there adds noise
# without safety, so the strict generics check is relaxed project-wide.
disallow_any_generics = false

# The test suite bootstraps ``sys.path`` before imports and is intentionally
# untyped (mirroring the ruff ``tests/*`` ignore); type-check the package only.
exclude = "^tests/"
